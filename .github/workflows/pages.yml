name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "papers/FIGURE-INDEX.json"
      - "papers/figs/summaries/**"
      - "papers/figs/previews/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and export portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install validators
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Refuse committed PDFs under papers/
        run: |
          tracked="$(git ls-files 'papers/**/*.pdf')"
          if [[ -n "$tracked" ]]; then
            echo "F4: committed PDFs forbidden:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
      - name: Next.js static export (no LaTeX)
        run: bash portal/build.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
